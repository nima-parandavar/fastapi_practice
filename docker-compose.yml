services:
  db:
    image: docker.arvancloud.ir/postgres:17.6
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=123456789
    restart: always
  
  adminer:
    image: docker.arvancloud.ir/adminer:5
    restart: always
    ports:
      - 8080:8080
    environment:
      - ADMINER_DESIGN=hever